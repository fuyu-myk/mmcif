[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
mmcif-cif = { path = "crates/mmcif-cif", version = "0.1.0" }
mmcif-model = { path = "crates/mmcif-model", version = "0.1.0" }
mmcif-ccd = { path = "crates/mmcif-ccd", version = "0.1.0" }
memchr = "2.8"
memmap2 = "0.9"
thiserror = "2.0"
proptest = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = 1
