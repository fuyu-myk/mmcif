[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "mmcif-io"
dynamic = ["version"]
description = "Correctness-first mmCIF, BinaryCIF and PDB structure IO with typed numbering"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "fuyu-myk" }]
keywords = ["mmcif", "binarycif", "pdb", "protein", "structure"]
dependencies = ["numpy>=1.24"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Repository = "https://github.com/fuyu-myk/mmcif"
Issues = "https://github.com/fuyu-myk/mmcif/issues"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.maturin]
module-name = "mmcif_io"
